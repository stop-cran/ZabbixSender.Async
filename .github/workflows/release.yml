name: release

# Tag-only. Up to 1.3 this package was pushed to nuget.org on every push to master, so any commit
# reaching the default branch was published under the package name without a separate, deliberate
# act. Publishing is now a tagged decision, authenticated by nuget.org trusted publishing (OIDC)
# rather than a long-lived API key. tools/check-publication-triggers.py keeps it that way.
on:
  push:
    tags:
      - 'v*'

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # Everything that runs code from the repository or its dependencies (restore, build, tests, the
  # Zabbix containers) happens here, without an OIDC token: nothing in this job can obtain a
  # nuget.org key, attest, or write to the repository.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: The tag must name the version the build produces
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared=$(dotnet msbuild src/ZabbixSender.Async.csproj -getProperty:Version | tr -d '[:space:]')
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match <Version>$declared</Version> in src/ZabbixSender.Async.csproj"
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_ENV"
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      - name: A stable release must come from master
        shell: bash
        run: |
          set -euo pipefail
          # Previews may be cut from a pull request branch so they can be tried before merging.
          # A stable version is what every unpinned consumer receives, so it must be reviewed code.
          case "$version" in
            *-*) echo "$version is a prerelease; any branch is allowed." ;;
            *)
              if ! git merge-base --is-ancestor HEAD origin/master; then
                echo "::error::$version is a stable version, but $GITHUB_REF_NAME is not on master."
                exit 1
              fi
              ;;
          esac

      - name: Assemble the release notes before anything irreversible happens
        shell: bash
        run: |
          set -euo pipefail
          # A missing section is worth stopping for, and stopping is only cheap while nothing has
          # been published: after the push it would leave a package with no release to explain it.
          mkdir -p artifacts
          awk -v v="## [$version]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/notes.md
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "::error::CHANGELOG.md has no section for $version; refusing to publish a release with empty notes."
            exit 1
          fi
          {
            echo "NuGet: https://www.nuget.org/packages/ZabbixSender.Async/${version}"
            echo
            cat /tmp/notes.md
          } > artifacts/notes.md

      - name: Start Zabbix for the integration tests
        run: docker compose up -d

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

      - name: Zabbix logs
        if: failure()
        run: docker compose logs --no-color

      - name: Pack
        run: dotnet pack src/ZabbixSender.Async.csproj --no-build -c Release -o artifacts

      - name: The package must carry its documentation, symbols and source link
        shell: bash
        run: |
          set -euo pipefail
          nupkg="artifacts/ZabbixSender.Async.${version}.nupkg"
          snupkg="artifacts/ZabbixSender.Async.${version}.snupkg"
          test -f "$nupkg"
          test -f "$snupkg"
          unzip -l "$nupkg" | grep -q ' README.md$'
          unzip -l "$nupkg" | grep -q ' license.txt$'
          unzip -l "$nupkg" | grep -q ' lib/net10.0/ZabbixSender.Async.dll$'
          unzip -l "$nupkg" | grep -q ' lib/net10.0/ZabbixSender.Async.xml$'
          unzip -l "$snupkg" | grep -q ' lib/net10.0/ZabbixSender.Async.pdb$'
          # The nuspec must point at the commit being released, or source link resolves elsewhere.
          commit=$(git rev-parse HEAD)
          unzip -p "$nupkg" ZabbixSender.Async.nuspec | grep -q "commit=\"$commit\""

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/notes.md
          if-no-files-found: error
          retention-days: 7

  # Holds the OIDC token, and runs nothing from the repository: no checkout, no restore, no build.
  # It only handles the files the build job verified and first-party actions.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # The nuget.org trusted publishing policy is bound to this repository, this workflow file and
    # this environment. Renaming either one breaks publishing until the policy is updated.
    environment: nuget
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # OIDC, for both the build attestation and the nuget.org token exchange
      attestations: write  # record the provenance attestation
    env:
      version: ${{ needs.build.outputs.version }}
    steps:
      # Fails on a digest mismatch, so the files are the ones the build job uploaded.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # Requested immediately before the push on purpose: the short-lived key is valid for one
      # hour, and each OIDC token buys exactly one key.
      - name: Exchange this run's OIDC identity for a short-lived nuget.org key
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          # The nuget.org profile name, which is public. A secret here would buy nothing, and an
          # undefined secret silently expands to the empty string.
          user: stop-cran

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::the OIDC exchange returned no key; nothing was published."
            exit 1
          fi
          dotnet nuget push "artifacts/ZabbixSender.Async.${version}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/ZabbixSender.Async.${version}.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          case "$version" in *-*) flags+=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ZabbixSender.Async $version" \
            --notes-file artifacts/notes.md "${flags[@]}"