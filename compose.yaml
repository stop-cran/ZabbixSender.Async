# Zabbix server and frontend for the integration tests and for trying the library out locally:
#
#   docker compose up -d
#   dotnet test
#
# The frontend is at http://localhost:8080 (Admin / zabbix), the trapper port is 10051.
# Set ZABBIX_VERSION (for example to 7.0) to run against another Zabbix release.

name: zabbix-sender-async

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 2s
      timeout: 5s
      retries: 30

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-${ZABBIX_VERSION:-7.4}-latest
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      # Pick up hosts and items created by the tests without waiting for the default 10s.
      ZBX_CACHEUPDATEFREQUENCY: 1
    ports:
      - "10051:10051"
    depends_on:
      postgres:
        condition: service_healthy

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-${ZABBIX_VERSION:-7.4}-latest
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      PHP_TZ: UTC
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
